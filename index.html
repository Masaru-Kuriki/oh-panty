<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>OH!PANTY!</title>
  <link rel="stylesheet" href="style.css?v=1781249499">
</head>
<body>
  <main class="container">
    <header class="top-header">
      <img src="assets/oh!panty!.png" alt="OH!PANTY!" class="title-logo">
      <div class="title-sub">あかいパンツは　だれだ？</div>
    </header>

    <section class="player-select">
      <h2 class="select-heading">だれが あそぶ？</h2>
      <div class="card-grid" id="cardGrid">
        <!-- JS で動的に挿入 -->
      </div>
    </section>
  </main>

  <!-- 名前入力モーダル -->
  <div class="modal-backdrop" id="nameModal" hidden>
    <div class="modal">
      <div class="modal-title" id="modalTitle">プレイヤー名を入力</div>
      <input type="text" class="modal-input" id="modalInput" maxlength="20" placeholder="名前（最大20文字）">
      <div class="modal-actions">
        <button class="modal-btn" id="modalCancel">キャンセル</button>
        <button class="modal-btn modal-btn--primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>

  <script src="player.js?v=1781249499"></script>
  <script src="index.js?v=1781249499"></script>
  <script src="click.js?v=1781249499"></script>
</body>
</html>
