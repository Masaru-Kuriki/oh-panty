<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>レベル選択 - OH!PANTY!</title>
  <link rel="stylesheet" href="style.css?v=1781244862">
</head>
<body>
  <main class="container">
    <nav class="page-nav">
      <a href="index.html" class="back-link">← もどる</a>
      <div class="current-player">
        <span class="current-player-label">PLAYER</span>
        <span class="current-player-name" id="currentName">—</span>
      </div>
    </nav>

    <section class="level-select">
      <h2 class="level-heading">レベルえらぼう</h2>
      <div class="level-list" id="levelList">
        <a class="level-card" href="play.html?level=1" data-level="1">
          <div class="level-card-inner">
            <div class="level-card-main">
              <div class="level-card-tag">Lv 1</div>
              <div class="level-card-title">かんたん</div>
              <div class="level-card-best">ベスト: <span data-best="1">0</span>点</div>
            </div>
            <div class="level-card-side">
              <div class="level-card-q">5</div>
              <div class="level-card-q-label">問</div>
            </div>
          </div>
        </a>
        <a class="level-card level-card--lv2" href="play.html?level=2" data-level="2">
          <div class="level-card-inner">
            <div class="level-card-main">
              <div class="level-card-tag">Lv 2</div>
              <div class="level-card-title">ふつう</div>
              <div class="level-card-best">ベスト: <span data-best="2">0</span>点</div>
            </div>
            <div class="level-card-side">
              <div class="level-card-q">10</div>
              <div class="level-card-q-label">問</div>
            </div>
          </div>
        </a>
        <a class="level-card level-card--lv3" href="play.html?level=3" data-level="3">
          <div class="level-card-inner">
            <div class="level-card-main">
              <div class="level-card-tag">Lv 3</div>
              <div class="level-card-title">むずかしい</div>
              <div class="level-card-best">ベスト: <span data-best="3">0</span>点</div>
            </div>
            <div class="level-card-side">
              <div class="level-card-q">50</div>
              <div class="level-card-q-label">問</div>
            </div>
          </div>
        </a>
      </div>

      <div class="level-rule">
        <div class="level-rule-hearts">♥ ♥ ♥</div>
        <div>3回まちがえたら ゲームオーバー</div>
      </div>

      <div style="margin-top: 22px; text-align: center;">
        <a href="ranking.html?level=1" class="back-link" style="font-weight: 700;">🏆 ランキングを見る →</a>
      </div>
    </section>
  </main>

  <script src="player.js?v=1781244862"></script>
  <script src="level.js?v=1781244862"></script>
  <script src="click.js?v=1781244862"></script>
</body>
</html>
